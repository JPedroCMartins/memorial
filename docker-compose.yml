services:
  web:
    build:
      context: .
    container_name: projeto-web
    ports:
      - "${PORT:-8001}:5001"
    environment:
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no .env}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/memorial.db}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/instance/uploads}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
