<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Memorial</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_martins.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{{ url_for('static', filename='css/user.css') }}" rel="stylesheet">
</head>
<body class="auth-page">

    <main class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='images/logo_martins.png') }}" alt="Memorial"
                    style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <span style="display:none;">M</span>
            </div>
            <h1>Bem-vindo de volta</h1>
            <p>Entre para gerenciar seus memoriais.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-3">
            {% for category, message in messages %}
            <div class="toast {{ 'error' if category == 'danger' else 'success' }}" style="position:static;animation:none;box-shadow:none;">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="#" method="POST" novalidate>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" class="input-user" id="email" name="email" placeholder="seu@email.com"
                    autocomplete="email" required autofocus>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <div class="password-wrap">
                    <input type="password" class="input-user" id="password" name="password"
                        placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" aria-label="Mostrar senha"
                        onclick="togglePassword(this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <button type="submit" class="btn-user btn-gold btn-block mt-3">
                Entrar <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <p class="auth-switch">
            Não tem uma conta? <a href="{{ url_for('memorial.register') }}">Registre-se</a>
        </p>

        <p class="auth-switch" style="margin-top:0.6rem;">
            <a href="{{ url_for('memorial.landing') }}" style="font-weight:500;"><i class="fas fa-arrow-left"></i> Voltar ao início</a>
        </p>
    </main>

    <script src="{{ url_for('static', filename='js/user.js') }}"></script>
    <script>
        function togglePassword(btn) {
            const input = btn.closest('.password-wrap').querySelector('input');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            btn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
        }
    </script>
</body>
</html>
