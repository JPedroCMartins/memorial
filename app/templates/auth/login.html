<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - J. Pedro C. Martins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo_martins.png') }}">
    
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center; /* Alinha verticalmente */
            justify-content: center; /* Alinha horizontalmente */
        }

        /* Estilo para o container do formulário */
        .login-card {
            width: 100%;
            max-width: 400px; /* Define uma largura máxima */
            padding: 2rem;
            border-radius: 1rem;
            /* A cor do card já é ajustada pelo data-bs-theme="dark" */
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            AOS.init({ duration: 1000, easing: 'ease-in-out' });
        });
    </script>

    <div class="card shadow-lg login-card" data-aos="fade-up">
        <div class="card-body">
            <h2 class="card-title text-center mb-4">Login</h2>
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <input type="hidden" name="next" value="">
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <a href="/registrar">Registre aqui</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
